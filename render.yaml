services:
  - type: web
    name: ai-competitor-intelligence
    runtime: image
    plan: free
    envVars:
      - key: APP_AUTH_REQUIRED
        value: "true"
      - key: APP_AUTH_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
